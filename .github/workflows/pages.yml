# Publishes the game on GitHub Pages (Settings → Pages → Source: GitHub Actions) on every push to
# main: the game as it runs in development (index.html, css/, js/ as ES modules), the single-file
# build from dist/ and the 3D appliance preview. The unit tests run first.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits instead of cancelling a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Collect the site
        run: |
          mkdir -p _site/tools
          cp -r index.html css js _site/
          cp dist/acai-fever.html _site/
          cp tools/appliances-3d.html _site/tools/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
