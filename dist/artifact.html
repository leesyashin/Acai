en Rekord!","intro.fourSeats.title":"Volles Haus","intro.fourSeats.text":"Jetzt gibt es 4 Pl\xE4tze \u2013 und daf\xFCr 4 Herzen. Mehr Bowl-Pl\xE4tze und ein zweiter Mixer aus dem Shop helfen dir!","shop.title":"Shop","shop.tab.ingredients":"Zutaten","shop.tab.kitchen":"K\xFCche","shop.tab.decor":"Deko","shop.perUse":"pro Portion","shop.owned":"Gekauft","shop.max":"Max","shop.qualityAria":"Qualit\xE4t {n} von 2","shop.buyAria":"{name} kaufen f\xFCr {n} M\xFCnzen","shop.upgradeAria":"Qualit\xE4t von {name} verbessern f\xFCr {n} M\xFCnzen","shop.noMoney":"Nicht genug M\xFCnzen!","shop.boughtUpg":"{name} gekauft!","shop.upgraded":"Bessere Qualit\xE4t: {name}!","shop.maxed":"Schon voll ausgebaut.","shop.locked":"Ab Level {n}","shop.lockedToast":"Wird ab Level {n} freigeschaltet.","shop.needs":"Erst: {name}","shop.needsToast":"Kauf zuerst \u201E{name}\u201C.","shop.tipTitle":"Tipp","shop.tipText":"Neue Zutaten kommen mit den Leveln. Hier machst du sie besser \u2013 jede ist sofort in den Bestellungen.","shop.tipQuality":"Qualit\xE4t \u2605: +30 % und +60 % M\xFCnzen pro Portion.","shop.notYet":"Kommt mit Level {n}","shop.stat.cupLift":"Pl\xE4tze mit Lift","shop.stat.freeze":"Mixer mit Freeze","shop.levelOf":"Stufe {a} von {b}","shop.stat.blendTime":"Mixzeit","shop.stat.portions":"Bowls pro Mix","shop.stat.blenders":"Mixer","shop.stat.bowlSlots":"Bowl-Pl\xE4tze","shop.stat.matchaSlots":"Matcha-Pl\xE4tze","shop.stat.patience":"Geduld der G\xE4ste","shop.seconds":"{n} s","shop.percent":"+{n} %","shop.kitchenNow":"Deine K\xFCche","shop.nextModel":"Neues Modell: {name}","shop.yourModel":"Dein Modell: {name}","shop.decorNow":"Deko macht G\xE4ste geduldiger","settings.title":"Einstellungen","settings.language":"Sprache","settings.music":"Musik","settings.sfx":"Sounds","settings.haptics":"Vibration","settings.on":"An","settings.off":"Aus","settings.stats":"Statistik","settings.statPlayed":"Gespielte Runden","settings.statServed":"Bediente G\xE4ste","settings.statEarned":"Verdien
