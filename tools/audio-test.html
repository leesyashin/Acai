<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Test</title>
<link rel="stylesheet" href="../css/base.css">
<style>
  html, body { height: auto; }
  body { overflow: auto; padding: 16px; box-sizing: border-box; }
  .wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 44px; }
  section.panel { padding: 16px 18px 20px; }
  section h2 { margin: 0 0 12px; font-family: var(--font-display); font-size: 26px; font-weight: 400; color: var(--acai-2); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  .row .btn.small { font-size: 19px; }
  .btn.on { background: var(--leaf); color: var(--white); }
  .btn.off { background: var(--danger); color: var(--white); }
  pre#state { margin: 0; white-space: pre-wrap; font-size: 15px; color: var(--ink-soft); }
  .meter { height: 16px; border: var(--outline); border-radius: 999px; background: var(--cream); overflow: hidden; margin-top: 12px; }
  .meter > i { display: block; height: 100%; width: 0; background: var(--lagoon); transition: width 0.08s linear; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 4px 10px; border-bottom: 2px solid var(--cream); }
  td.bad { color: var(--danger); }
  td.good { color: var(--leaf-2); }
  @media (max-width: 600px) { h1 { font-size: 32px; } .row .btn.small { font-size: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title-text" data-i18n="audio.test.title"></h1>

  <section class="panel">
    <h2 data-i18n="audio.test.start"></h2>
    <div class="row">
      <button class="btn small green" id="unlock" data-i18n="audio.test.unlock"></button>
      <button class="btn small cream" id="lang-de">Deutsch</button>
      <button class="btn small cream" id="lang-en">English</button>
    </div>
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
  </section>

  <section class="panel">
    <h2 data-i18n="audio.test.sfx"></h2>
    <div class="row" id="sfx-row"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn small purple" id="star3" data-i18n="audio.test.star3"></button>
    </div>
  </section>

  <section class="panel">
    <h2 data-i18n="audio.test.music"></h2>
    <div class="row">
      <button class="btn small lagoon" data-music="menu" data-i18n="audio.test.menu"></button>
      <button class="btn small lagoon" data-music="game" data-i18n="audio.test.game"></button>
      <button class="btn small cream" data-music="" data-i18n="audio.test.stop"></button>
    </div>
  </section>

  <section class="panel">
    <h2 data-i18n="audio.test.loops"></h2>
    <div class="row">
      <button class="btn small" data-loop="blender" data-on="1" data-i18n="audio.test.blenderOn"></button>
      <button class="btn small cream" data-loop="blender" data-on="0" data-i18n="audio.test.blenderOff"></button>
    </div>
  </section>

  <section class="panel">
    <h2 data-i18n="audio.test.toggles"></h2>
    <div class="row">
      <button class="btn small" id="toggle-sfx" data-toggle="sfx"></button>
      <button class="btn small" id="toggle-music" data-toggle="music"></button>
      <button class="btn small cream" id="suspend" data-i18n="audio.test.suspend"></button>
      <button class="btn small cream" id="resume" data-i18n="audio.test.resume"></button>
    </div>
  </section>

  <section class="panel">
    <h2 data-i18n="audio.test.levels"></h2>
    <div class="row">
      <button class="btn small pink" id="check" data-i18n="audio.test.check"></button>
    </div>
    <table id="levels" hidden>
      <thead><tr><th data-i18n="audio.test.colName"></th><th>Peak</th><th>RMS</th><th data-i18n="audio.test.colResult"></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="panel">
    <h2 data-i18n="audio.test.state"></h2>
    <pre id="state"></pre>
  </section>
</div>

<script type="module">
  import { audio, SFX_NAMES, MUSIC_TRACKS, renderSfxOffline, renderMusicOffline, renderLoopOffline } from '../js/audio.js';
  import { registerStrings, t, setLang, getLang, onLangChange } from '../js/i18n.js';

  registerStrings({
    de: {
      'audio.test.title': 'Audio-Test', 'audio.test.start': 'Start', 'audio.test.unlock': 'Audio freischalten',
      'audio.test.sfx': 'Soundeffekte', 'audio.test.star3': 'Drei Sterne nacheinander',
      'audio.test.music': 'Musik', 'audio.test.menu': 'Menü-Musik', 'audio.test.game': 'Spiel-Musik', 'audio.test.stop': 'Musik aus',
      'audio.test.loops': 'Dauerklänge', 'audio.test.blenderOn': 'Mixer an', 'audio.test.blenderOff': 'Mixer aus',
      'audio.test.toggles': 'Schalter', 'audio.test.sfxOn': 'Effekte: an', 'audio.test.sfxOff': 'Effekte: aus',
      'audio.test.musicOn': 'Musik: an', 'audio.test.musicOff': 'Musik: aus',
      'audio.test.suspend': 'Pausieren', 'audio.test.resume': 'Fortsetzen',
      'audio.test.levels': 'Pegelprüfung (offline)', 'audio.test.check': 'Alle Pegel prüfen',
      'audio.test.colName': 'Klang', 'audio.test.colResult': 'Ergebnis', 'audio.test.ok': 'in Ordnung', 'audio.test.fail': 'außerhalb',
      'audio.test.state': 'Zustand',
    },
    en: {
      'audio.test.title': 'Audio test', 'audio.test.start': 'Start', 'audio.test.unlock': 'Unlock audio',
      'audio.test.sfx': 'Sound effects', 'audio.test.star3': 'Three stars in a row',
      'audio.test.music': 'Music', 'audio.test.menu': 'Menu music', 'audio.test.game': 'Game music', 'audio.test.stop': 'Music off',
      'audio.test.loops': 'Loops', 'audio.test.blenderOn': 'Blender on', 'audio.test.blenderOff': 'Blender off',
      'audio.test.toggles': 'Toggles', 'audio.test.sfxOn': 'Effects: on', 'audio.test.sfxOff': 'Effects: off',
      'audio.test.musicOn': 'Music: on', 'audio.test.musicOff': 'Music: off',
      'audio.test.suspend': 'Suspend', 'audio.test.resume': 'Resume',
      'audio.test.levels': 'Level check (offline)', 'audio.test.check': 'Check all levels',
      'audio.test.colName': 'Sound', 'audio.test.colResult': 'Result', 'audio.test.ok': 'ok', 'audio.test.fail': 'out of range',
      'audio.test.state': 'State',
    },
  });

  const $ = (sel) => document.querySelector(sel);
  const sfxRow = $('#sfx-row');
  for (const name of SFX_NAMES) {
    const b = document.createElement('button');
    b.className = 'btn small cream';
    b.dataset.sfx = name;
    b.textContent = name;
    sfxRow.append(b);
  }

  function renderText() {
    document.documentElement.lang = getLang();
    for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
    const s = audio.sfxOn();
    const m = audio.musicOn();
    $('#toggle-sfx').textContent = t(s ? 'audio.test.sfxOn' : 'audio.test.sfxOff');
    $('#toggle-sfx').className = `btn small ${s ? 'on' : 'off'}`;
    $('#toggle-music').textContent = t(m ? 'audio.test.musicOn' : 'audio.test.musicOff');
    $('#toggle-music').className = `btn small ${m ? 'on' : 'off'}`;
  }
  onLangChange(renderText);
  renderText();

  // Like the game: every gesture unlocks (idempotent).
  document.addEventListener('pointerdown', () => audio.unlock(), { capture: true });

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    audio.unlock();
    if (b.dataset.sfx) audio.sfx(b.dataset.sfx);
    else if (b.dataset.music !== undefined) audio.music(b.dataset.music || null);
    else if (b.dataset.loop) audio.loop(b.dataset.loop, b.dataset.on === '1');
    else if (b.id === 'toggle-sfx') audio.setSfx(!audio.sfxOn());
    else if (b.id === 'toggle-music') audio.setMusic(!audio.musicOn());
    else if (b.id === 'suspend') audio.suspend();
    else if (b.id === 'resume') audio.resume();
    else if (b.id === 'lang-de') setLang('de');
    else if (b.id === 'lang-en') setLang('en');
    else if (b.id === 'star3') [0, 450, 900].forEach((ms) => setTimeout(() => audio.sfx('star'), ms));
    else if (b.id === 'check') runCheck();
    renderText();
  });

  async function runCheck() {
    const table = $('#levels');
    const body = table.querySelector('tbody');
    body.textContent = '';
    table.hidden = false;
    const jobs = [
      ...SFX_NAMES.map((n) => [n, () => renderSfxOffline(n, 3)]),
      ['loop:blender', () => renderLoopOffline('blender', 3)],
      ...MUSIC_TRACKS.map((n) => [`music:${n}`, () => renderMusicOffline(n, 12)]),
    ];
    for (const [label, job] of jobs) {
      const r = await job();
      const ok = r && r.peak >= 0.05 && r.peak <= 0.99;
      const tr = document.createElement('tr');
      tr.dataset.name = label;
      tr.dataset.peak = r ? r.peak.toFixed(4) : '';
      tr.innerHTML = `<td>${label}</td><td>${r ? r.peak.toFixed(3) : '–'}</td><td>${r ? r.rms.toFixed(4) : '–'}</td>`
        + `<td class="${ok ? 'good' : 'bad'}">${t(ok ? 'audio.test.ok' : 'audio.test.fail')}</td>`;
      body.append(tr);
    }
    table.dataset.done = '1';
  }

  // Live state + output meter.
  setInterval(() => {
    $('#state').textContent = JSON.stringify(audio.state(), null, 2);
    const lv = audio.level();
    $('#meter').style.width = `${Math.min(100, lv.peak * 140)}%`;
  }, 120);

  window.audio = audio;
  window.audioTest = { renderSfxOffline, renderMusicOffline, renderLoopOffline, SFX_NAMES, MUSIC_TRACKS };
</script>
</body>
</html>
