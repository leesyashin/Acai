<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<link rel="stylesheet" href="../css/base.css">
<style>
  /* Dev page: scrollable, light background, everything else from base.css tokens. */
  html, body { height: auto; }
  body {
    overflow: auto;
    background: var(--cream);
    padding: 16px;
    font-weight: 800;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 24px;
    margin-bottom: 8px;
  }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: 34px; margin: 0; color: var(--acai-2); }
  h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 26px 0 10px; color: var(--acai); }
  #status { font-size: 15px; padding: 6px 12px; border-radius: 10px; border: 2px solid var(--ink); background: var(--paper); }
  #status.bad { background: var(--danger); color: var(--white); }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px;
    border-radius: 14px;
    background: var(--paper);
    border: 2px solid rgba(42, 18, 54, 0.15);
    font-size: 12px;
    text-align: center;
    max-width: 480px;
  }
  .cell svg { display: block; }
  .cell .row { display: flex; align-items: flex-end; gap: 6px; }
  .dark { background: var(--acai); border-color: var(--acai-2); color: var(--white); }
  .wall { background: #ffe6c4; }
  .machine { position: relative; }
  .machine > .cup { position: absolute; }
  .wide svg { max-width: 100%; height: auto; }
  .wide { max-width: none; width: calc(100% - 20px); }
  .bubble { background: var(--white); border: 3px solid var(--ink); border-radius: 18px; padding: 4px; }
  .mock { position: relative; width: 1280px; height: 800px; overflow: hidden; border-radius: 14px; background: var(--cream); flex: none; }
  .mock > * { position: absolute; }
  .mock .counter { left: 0; top: 294px; width: 1280px; height: 44px; background: linear-gradient(180deg, #ece8e2 0, #fdfcfa 22px, #cfc6ba 23px, #b08458 24px, #8a6236 100%); }
  /* the order bubbles like css/game.css .g-bubble (js/game-view.js bubbleMarkup): their bottom at stage y 179, pushed
     by --dx, the tail on the head; the bowl part (the base cup and its rows, each item on a 40 px circle in its layer's
     tint, the layer badges in front), the divider, the glass with its fruit badge, the patience bar. Block SVGs (no
     baseline gap under them), so an item is 40 × 40 and a row 40 high, like in the game */
  .mock .order { --dx: 0px; top: auto; bottom: 621px; translate: calc(-50% + var(--dx)) 0; background: var(--white); border: 2px solid #ddd2e3; border-radius: 18px; padding: 4px 6px; box-shadow: 0 8px 18px rgba(40, 20, 50, 0.2); line-height: 1; }
  .mock .order svg { display: block; position: relative; }
  .mock .order::after { content: ""; position: absolute; z-index: -1; left: calc(50% - var(--dx)); bottom: -11px; width: 16px; height: 16px; translate: -50% 0; rotate: 45deg; background: var(--white); border: solid #ddd2e3; border-width: 0 2px 2px 0; }
  .mock .order .o { display: flex; align-items: stretch; }
  .mock .order .part { position: relative; display: flex; align-items: center; padding: 2px 3px; }
  .mock .order .bowl { gap: 4px; }
  .mock .order .base, .mock .order .i { position: relative; display: block; flex: none; }
  .mock .order .base::before, .mock .order .i::before { content: ""; position: absolute; inset: 1px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff 0, var(--t) 72%); box-shadow: inset 0 0 0 1.5px var(--e); }
  .mock .order .rows { display: flex; flex-direction: column; }
  .mock .order .r { display: flex; align-items: center; gap: 2px; height: 40px; }
  .mock .order .n { position: relative; z-index: 1; display: inline-grid; place-items: center; flex: none; width: 18px; height: 18px; margin-right: 1px; box-sizing: border-box; border: 1.5px solid var(--white); border-radius: 50%; box-shadow: 0 1px 2px rgba(40, 20, 50, 0.35); background: var(--c); color: var(--white); font-family: var(--font-display); font-size: 12px; }
  .mock .order .base .n { position: absolute; left: -4px; top: -3px; }
  .mock .order .drink { margin-left: 13px; }
  .mock .order .drink::before { content: ""; position: absolute; left: -9px; top: 6px; bottom: 6px; width: 2px; border-radius: 1px; background: rgba(42, 18, 54, 0.16); }
  .mock .order .glass { position: relative; display: block; margin: 0 14px 0 -12px; }
  .mock .order .fruit { position: absolute; left: 47px; top: 16px; width: 26px; height: 26px; box-sizing: border-box; display: grid; place-items: center; background: var(--white); border: 1.5px solid #cfc3d6; border-radius: 50%; box-shadow: 0 1px 3px rgba(40, 20, 50, 0.25); }
  .mock .order .bar { height: 12px; margin: 4px 1px 0; border-radius: 6px; background: #e6deeb; overflow: hidden; }
  .mock .order .bar i { display: block; height: 100%; background: var(--c); }
  .mock .bin { width: 86px; height: 100px; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; box-shadow: 0 4px 0 var(--ink); }
  .mock .hud { left: 12px; top: 10px; display: flex; gap: 12px; align-items: center; }
  .mock .pill { display: flex; align-items: center; gap: 6px; background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 14px 4px 6px; font-family: var(--font-display); font-size: 24px; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <button class="btn small" id="lang" type="button"></button>
  <span id="status"></span>
</header>
<main id="out"></main>
<script type="module">
import * as art from '../js/art.js';
import { INGREDIENTS, ingName, isMatchaFruit } from '../js/data.js';
import { pantryKind } from '../js/pantry3d.js';
import { createRng } from '../js/rng.js';
import { registerStrings, t, setLang, getLang } from '../js/i18n.js';

document.body.insertAdjacentHTML('afterbegin', art.artDefsSVG()); // shared gradients (js/svg.js)

registerStrings({
  de: {
    'artprev.title': 'Açaí Fever – Grafik-Vorschau', 'artprev.lang': 'English',
    'artprev.icons': 'Zutaten (64 px und 36 px)', 'artprev.packs': 'Tiefkühl-Packs', 'artprev.bowls': 'Bowls',
    'artprev.bowlsSmall': 'Bowls klein (Bestellblase)', 'artprev.cups': 'Matcha-Gläser', 'artprev.customers': 'Kunden × Stimmungen',
    'artprev.blender': 'Mixer', 'artprev.machine': 'Matcha-Maschine', 'artprev.ui': 'UI-Symbole (64 px / 28 px)',
    'artprev.decor': 'Deko', 'artprev.scene': 'Laden-Hintergrund', 'artprev.logo': 'Logo', 'artprev.map': 'Level-Karte (drei Gegenden, mit Rändern für Vollbild)',
    'artprev.appIcon': 'App-Icon (normal, maskable, klein)', 'artprev.titleCounter': 'Theke im Titelbild',
    'artprev.ok': 'Keine doppelten IDs ({n} SVGs)', 'artprev.dup': 'Doppelte IDs: {list}',
    'artprev.empty': 'leer', 'artprev.baseOnly': 'nur Basis', 'artprev.mock': 'Im Spiel (Attrappe, 1280 × 800)',
    'artprev.pours': 'Füllstand nach jedem Ausgießen (Portionen übrig)',
    'artprev.bins': 'Zutaten-Behälter, gezeichnet (ohne WebGL; 120 und 96 px wie im Spiel)', 'artprev.stack': 'Bowl-Stapel und freier Platz',
    'artprev.counter': 'Theke: Arbeitsplatte mit Regal, Gefriertruhe, Podest', 'artprev.scoops': 'Was man aus den Behältern zieht',
  },
  en: {
    'artprev.title': 'Açaí Fever – art preview', 'artprev.lang': 'Deutsch',
    'artprev.icons': 'Ingredients (64 px and 36 px)', 'artprev.packs': 'Frozen packs', 'artprev.bowls': 'Bowls',
    'artprev.bowlsSmall': 'Small bowls (order bubble)', 'artprev.cups': 'Matcha glasses', 'artprev.customers': 'Customers × moods',
    'artprev.blender': 'Blender', 'artprev.machine': 'Matcha machine', 'artprev.ui': 'UI icons (64 px / 28 px)',
    'artprev.decor': 'Decor', 'artprev.scene': 'Shop backdrop', 'artprev.logo': 'Logo', 'artprev.map': 'Level map (three regions, with full-bleed margins)',
    'artprev.appIcon': 'App icon (normal, maskable, small)', 'artprev.titleCounter': 'Title screen counter',
    'artprev.ok': 'No duplicate ids ({n} SVGs)', 'artprev.dup': 'Duplicate ids: {list}',
    'artprev.empty': 'empty', 'artprev.baseOnly': 'base only', 'artprev.mock': 'In game (mock-up, 1280 × 800)',
    'artprev.pours': 'Fill level after each pour (portions left)',
    'artprev.bins': 'Ingredient containers, drawn (no WebGL; 120 and 96 px as in game)', 'artprev.stack': 'Bowl stack and free spot',
    'artprev.counter': 'Counter: worktop with shelves, freezer, riser', 'artprev.scoops': 'What a drag from a container carries',
  },
});

const params = new URLSearchParams(location.search);
setLang(params.get('lang') === 'en' ? 'en' : 'de');

const BOWLS = [
  { base: null, mid: [], top: [] },
  { base: 'acai', mid: [], top: [] },
  { base: 'pitaya', mid: [], top: [] },
  { base: 'spirulina', mid: [], top: [] },
  { base: 'acai', mid: ['banana'], top: [] },
  { base: 'acai', mid: ['granola'], top: ['honey'] },
  { base: 'pitaya', mid: ['strawberry', 'kiwi'], top: [] },
  { base: 'spirulina', mid: ['blueberry', 'mango'], top: ['coconut'] },
  { base: 'acai', mid: ['banana', 'strawberry', 'blueberry'], top: [] },
  { base: 'acai', mid: ['granola', 'mango', 'kiwi'], top: ['peanut', 'chia', 'mint'] },
  { base: 'pitaya', mid: ['banana', 'granola'], top: ['chocolate', 'cacao'] },
  { base: 'spirulina', mid: ['kiwi'], top: ['honey', 'chocolate', 'peanut'] },
  { base: 'acai', mid: ['strawberry'], top: ['coconut', 'chia', 'cacao'] },
  { base: 'pitaya', mid: ['mango', 'blueberry', 'banana'], top: ['honey', 'coconut', 'mint'] },
  { base: 'acai', mid: ['banana', 'granola', 'strawberry', 'blueberry', 'mango', 'kiwi'], top: [] },
  { base: 'acai', mid: ['banana', 'granola'], top: ['honey', 'chocolate', 'coconut', 'mint'] },
];
const MOODS = ['happy', 'neutral', 'impatient', 'angry'];

const el = (html, cls = 'cell') => `<div class="${cls}">${html}</div>`;
const section = (key, body) => `<h2>${t(key)}</h2><div class="grid">${body}</div>`;
const bowlLabel = (b) => (!b.base ? t('artprev.empty') : [b.base, ...b.mid, ...b.top].map((id) => ingName(id, true)).join(' · '));

function render() {
  document.getElementById('title').textContent = t('artprev.title');
  document.getElementById('lang').textContent = t('artprev.lang');
  let h = '';

  h += section('artprev.icons', INGREDIENTS.map((i) =>
    el(`<div class="row">${art.ingredientIcon(i.id, 64)}${art.ingredientIcon(i.id, 36)}</div>${ingName(i.id, true)}`)).join(''));

  h += section('artprev.packs', ['acai', 'pitaya', 'spirulina'].map((id) =>
    el(`<div class="row">${art.packIcon(id, 72)}${art.packIcon(id, 48)}</div>${ingName(id, true)}`)).join(''));

  h += section('artprev.bins', INGREDIENTS.filter((i) => i.layer !== 'base').map((i) =>
    el(`<div class="row">${art.binSVG(i.id, 120)}${art.binSVG(i.id, 96)}</div>${ingName(i.id, true)}`)).join(''));
  h += section('artprev.scoops', INGREDIENTS.filter((i) => i.layer !== 'base').map((i) =>
    el(`${art.scoopSVG(i.id, 84)}${ingName(i.id, true)}`)).join(''));
  h += section('artprev.counter', el(art.counterSVG(1280, 462), 'cell wide') +
    el(`<div class="row">${art.freezerSVG('well', 284, 186)}</div>well`) + el(art.riserSVG(420, 70)));

  h += section('artprev.stack', el(`<div class="row">${art.cupStackSVG(122)}${art.cupSpotSVG(140)}${art.bowlSVG(null, 140)}</div>`));

  h += section('artprev.bowls', BOWLS.map((b) => el(`${art.bowlSVG(b, 150)}${bowlLabel(b)}`)).join(''));
  h += section('artprev.bowlsSmall', BOWLS.slice(0, 14).map((b) => el(`<div class="bubble">${art.bowlSVG(b, 64)}</div>`)).join(''));

  const fruits = [null, ...INGREDIENTS.filter((i) => isMatchaFruit(i.id)).map((i) => i.id)];
  h += section('artprev.cups', fruits.map((id) =>
    el(`<div class="row">${[['empty'], ['mixing', 0], ['mixing', 0.5], ['ready']].map(([st, fill]) => art.matchaGlassSVG(id, st, 70, { fill })).join('')}</div>${id ? ingName(id, true) : '–'}`)).join(''));

  const looks = [];
  const rng = createRng(2024);
  for (let i = 0; i < 6; i++) looks.push(art.randomLook(rng));
  for (let i = 0; i < 6; i++) looks.push(art.lookFromSeed(i * 7 + 3));
  h += section('artprev.customers', looks.map((look) =>
    el(`<div class="row">${MOODS.map((m) => art.customerSVG(look, m, 110)).join('')}</div>${look.hairStyle} · ${look.accessory} · ${look.top} · ${look.pattern}`, 'cell wall')).join(''));
  h += `<div class="grid" style="margin-top:12px">${MOODS.map((m) => el(art.customerSVG(looks[1], m, 160) + m, 'cell wall')).join('')}</div>`;

  const blenders = [
    { state: 'empty' },
    { state: 'blending', base: 'acai', progress: 0.25 },
    { state: 'blending', base: 'pitaya', progress: 0.7 },
    { state: 'ready', base: 'acai', portions: 2, maxPortions: 2 },
    { state: 'ready', base: 'spirulina', portions: 1, maxPortions: 3 },
    { state: 'ready', base: 'pitaya', portions: 3, maxPortions: 3 },
    { state: 'overflowing', base: 'acai', portions: 2, maxPortions: 2 },
    { state: 'overflowing', base: 'spirulina', portions: 1, maxPortions: 2 },
    { state: 'ruined', base: 'acai' },
  ];
  const portionsLabel = (b) => (b.maxPortions ? ` · ${b.portions}/${b.maxPortions}` : '');
  // a ready jug drops one step per pour: 2 → 1 (standard) and 3 → 2 → 1 (jug upgrade)
  const pours = (base, max) => Array.from({ length: max }, (_, i) => ({ state: 'ready', base, portions: max - i, maxPortions: max }));
  h += section('artprev.blender', blenders.map((b) => el(`${art.blenderSVG(b, 150)}${b.state}${b.base ? ` · ${b.base}` : ''}${portionsLabel(b)}`)).join('') +
    el(`<div class="row">${art.blenderSVG(blenders[3], 90)}${art.blenderSVG(blenders[6], 90)}</div>90 px`) +
    el(`<div class="row">${pours('acai', 2).map((b) => art.blenderSVG(b, 120)).join('')}</div>` +
      `<div class="row">${pours('pitaya', 3).map((b) => art.blenderSVG(b, 120)).join('')}</div>${t('artprev.pours')}: 2/2 → 1/2 · 3/3 → 2/3 → 1/3`));

  const machine = (slots, fruitsIn, states, size) => {
    const cup = Math.round(size * art.MATCHA_CUP_SIZE);
    const cups = art.MATCHA_SLOT_X[slots].map((fx, i) => states[i] ? `<div class="cup" style="left:${fx * size - cup / 2}px;top:${art.MATCHA_SLOT_Y * size - cup}px">${art.matchaGlassSVG(fruitsIn[i], states[i], cup, { fill: 0.5, from: art.MATCHA_POUR_FROM })}</div>` : '').join('');
    return el(`<div class="machine" style="width:${size}px;height:${size}px">${art.matchaMachineSVG(slots, size)}${cups}</div>${slots}×`);
  };
  h += section('artprev.machine', machine(1, [null], [null], 200) + machine(1, ['strawberry'], ['mixing'], 200) +
    machine(2, ['mango', 'kiwi'], ['ready', 'mixing'], 220) + machine(2, ['blueberry', 'banana'], ['ready', 'ready'], 160));

  const ui = (fn) => `<div class="row">${fn(64)}${fn(28)}</div>`;
  h += section('artprev.ui', [
    ui((s) => art.trashSVG(s)), ui((s) => art.coinSVG(s)), ui((s) => art.heartSVG(true, s)), ui((s) => art.heartSVG(false, s)),
    ui((s) => art.starSVG(true, s)), ui((s) => art.starSVG(false, s)), ui((s) => art.clockSVG(s)), ui((s) => art.lockSVG(s)),
  ].map((x) => el(x)).join('') + el(`<div class="row">${art.coinSVG(28)}${art.heartSVG(true, 28)}${art.heartSVG(true, 28)}${art.heartSVG(false, 28)}${art.starSVG(true, 28)}${art.starSVG(false, 28)}</div>`, 'cell dark'));


  // In-context mock of the gameplay screen (stage px) to judge readability.
  const seats = [200, 493, 787, 1080];
  const orders = [
    { bowl: { base: 'acai', mid: ['banana', 'granola'], top: ['honey'] }, matcha: null, mood: 'happy' },
    { bowl: { base: 'pitaya', mid: ['strawberry'], top: ['coconut', 'mint'] }, matcha: 'mango', mood: 'neutral' },
    { bowl: { base: 'spirulina', mid: ['blueberry', 'kiwi'], top: [] }, matcha: null, mood: 'impatient' },
    { bowl: { base: 'acai', mid: ['mango', 'banana', 'blueberry'], top: ['chocolate', 'chia'] }, matcha: 'strawberry', mood: 'angry' },
  ];
  let m = art.shopSceneSVG(1280, 330).replace('<svg', '<svg style="position:absolute;left:0;top:0"');
  // decor where js/game-view.js puts it with 4 seats: plants at the left edge, the neon hanging from the wainscot's rail
  // between the two right guests' shoulders (x 934), under the faces
  m += `<div style="left:-1px;top:180px">${art.decorSVG('plants', 118)}</div><div style="left:889px;top:214px">${art.decorSVG('neon', 90)}</div>`;
  // each layer's tint and edge (css/game.css --l-*-tint / --l-*-edge) and its badge
  const tint = { base: ['#efe3f7', 'rgba(108, 42, 143, 0.2)'], mid: ['#dcf5e6', 'rgba(47, 191, 113, 0.3)'], top: ['#ffe3ee', 'rgba(255, 61, 139, 0.26)'] };
  const badge = { base: [1, 'var(--acai-2)'], mid: [2, 'var(--leaf)'], top: [3, 'var(--pitaya)'] };
  const tinted = (layer) => `--t:${tint[layer][0]};--e:${tint[layer][1]}`;
  const num = (layer) => `<span class="n" style="--c:${badge[layer][1]}">${badge[layer][0]}</span>`;
  const mood = { happy: 'var(--leaf)', neutral: 'var(--mango)', impatient: '#ff8a3d', angry: 'var(--danger)' };
  seats.forEach((x, i) => {
    // the guest's bust: its viewBox y 131 on the pass's top edge (stage y 294)
    m += `<div style="left:${x - 80}px;top:163px">${art.customerSVG(looks[i + 2], orders[i].mood, 160)}</div>`;
    const o = orders[i];
    // the order bubble (js/game-view.js bubbleMarkup): the base cup, rows 2 and 3 of 40 px items on tinted circles,
    // the matcha glass with its fruit behind a divider, the patience bar
    const row = (layer) => (o.bowl[layer].length ? `<div class="r">${num(layer)}${o.bowl[layer].map((id) => `<span class="i" style="${tinted(layer)}">${art.ingredientIcon(id, 40)}</span>`).join('')}</div>` : '');
    const base = `<span class="base" style="${tinted('base')}">${num('base')}${art.bowlSVG({ base: o.bowl.base, mid: [], top: [] }, 50)}</span>`;
    const drink = o.matcha ? `<div class="part drink"><span class="glass">${art.matchaGlassSVG(o.matcha, 'ready', 64)}<span class="fruit">${art.ingredientIcon(o.matcha, 22)}</span></span></div>` : '';
    m += `<div class="order" data-seat="${i}" style="left:${x}px"><div class="o"><div class="part bowl">${base}<div class="rows">${row('mid')}${row('top')}</div></div>${drink}</div><div class="bar"><i style="--c:${mood[o.mood]};width:${[90, 60, 35, 12][i]}%"></i></div></div>`;
  });
  // the game's layout (js/game-view.js, css/game.css): the work counter from y 338, the appliances in front of the pass
  m += `<div class="counter"></div><div style="left:0;top:338px">${art.counterSVG(1280, 462)}</div>`;
  m += `<div class="hud"><div class="pill">${art.heartSVG(true, 30)}${art.heartSVG(true, 30)}${art.heartSVG(false, 30)}</div><div class="pill">${art.coinSVG(32)} 128</div><div class="pill">${art.clockSVG(32)} 1:12</div><div class="pill">${art.starSVG(true, 30)}${art.starSVG(false, 30)}</div></div>`;
  m += `<div style="left:-40px;top:334px">${art.blenderSVG({ state: 'ready', base: 'acai', portions: 2, maxPortions: 2 }, 220)}</div>`;
  m += `<div style="left:120px;top:334px">${art.blenderSVG({ state: 'blending', base: 'pitaya', progress: 0.4, remaining: 3 }, 220)}</div>`;
  m += `<div style="left:16px;top:556px">${art.freezerSVG('well', 284, 186)}</div>`;
  ['acai', 'pitaya', 'spirulina'].forEach((id, i) => { m += `<div style="left:${28 + i * 88}px;top:648px">${art.packIcon(id, 84)}</div>`; });
  m += `<div style="left:16px;top:556px">${art.freezerSVG('rim', 284, 186)}</div>`;
  m += `<div style="left:340px;top:340px">${art.cupStackSVG(105)}</div>`;
  const slotBowls = [{ base: 'acai', mid: ['banana'], top: [] }, null, { base: 'pitaya', mid: ['strawberry', 'granola'], top: ['honey'] }, { base: null, mid: [], top: [] }];
  slotBowls.forEach((b, i) => { m += `<div style="left:${451 + i * 120}px;top:380px">${b ? art.bowlSVG(b, 120) : art.cupSpotSVG(120)}</div>`; });
  // the fruit trays first, then the jar of granola (sorted like js/game-view.js)
  const mids = INGREDIENTS.filter((i) => i.layer === 'mid').sort((a, b) => (pantryKind(b.id) === 'tray') - (pantryKind(a.id) === 'tray'));
  const tops = INGREDIENTS.filter((i) => i.layer === 'top');
  // rows of 96 px containers, centred under the cups (x 330–940) while they fit, else from x 330 on; a
  // container's art box starts 28 px above its row
  const row = (list, top) => {
    const w = list.length * 96 + (list.length - 1) * 6;
    const x0 = w <= 610 ? 330 + (610 - w) / 2 : 330;
    let r = `<div style="left:${x0 - 14}px;top:${top + 33}px">${art.riserSVG(w + 28, 70)}</div>`;
    list.forEach((ing, i) => { r += `<div style="left:${x0 + i * 102}px;top:${top - 28}px">${art.binSVG(ing.id, 96)}</div>`; });
    return r;
  };
  m += row(mids, 542) + row(tops, 642);
  const ms = 312;
  const cs = Math.round(ms * art.MATCHA_CUP_SIZE);
  m += `<div style="left:952px;top:265px;width:${ms}px;height:${ms}px">${art.matchaMachineSVG(2, ms)}${art.MATCHA_SLOT_X[2].map((fx, i) => `<div style="position:absolute;left:${fx * ms - cs / 2}px;top:${art.MATCHA_SLOT_Y * ms - cs}px">${art.matchaGlassSVG(i ? 'kiwi' : 'mango', i ? 'mixing' : 'ready', cs, { fill: 0.5, from: art.MATCHA_POUR_FROM })}</div>`).join('')}</div>`;
  m += `<div style="left:1137px;top:665px">${art.trashSVG(134)}</div>`;
  h += section('artprev.mock', `<div class="mock">${m}</div>`);

  h += section('artprev.decor', ['plants', 'jukebox', 'seating', 'neon'].map((id) => el(`${art.decorSVG(id, 140, { wall: false })}${id}`, 'cell wall')).join(''));
  h += section('artprev.scene', el(art.shopSceneSVG(1280, 330), 'cell wide'));
  h += section('artprev.logo', el(art.logoSVG(560), 'cell dark wide') + el(art.logoSVG(280), 'cell dark'));
  h += section('artprev.appIcon', el(art.appIconSVG(192)) + el(art.appIconSVG(192, { maskable: true })) + el(art.appIconSVG(48)));
  h += section('artprev.titleCounter', el(art.titleCounterSVG(), 'cell dark wide'));
  h += section('artprev.map', el(art.mapBackgroundSVG(1000), 'cell wide'));

  document.getElementById('out').innerHTML = h;
  // the mock's bubbles pushed into their seats' slots like js/game-view.js bubbleShift (4 seats: the widest bubbles,
  // 306 px, spread evenly over x 6–1274)
  for (const b of document.querySelectorAll('.mock .order')) {
    const i = Number(b.dataset.seat);
    const mid = 6 + 153 + i * (306 + (1268 - 4 * 306) / 3);
    const w = b.offsetWidth;
    b.style.setProperty('--dx', `${Math.round(Math.min(mid + 153 - w / 2, Math.max(mid - 153 + w / 2, seats[i])) - seats[i])}px`);
  }
  checkIds();
}

function checkIds() {
  const seen = new Map();
  for (const node of document.querySelectorAll('#out [id]')) seen.set(node.id, (seen.get(node.id) || 0) + 1);
  const dups = [...seen].filter(([, n]) => n > 1).map(([id]) => id);
  const status = document.getElementById('status');
  const n = document.querySelectorAll('#out svg').length;
  status.textContent = dups.length ? t('artprev.dup', { list: dups.join(', ') }) : t('artprev.ok', { n });
  status.className = dups.length ? 'bad' : '';
  if (dups.length) console.error(`duplicate ids: ${dups.join(', ')}`);
  document.body.dataset.ready = '1';
}

document.getElementById('lang').addEventListener('click', () => {
  setLang(getLang() === 'de' ? 'en' : 'de');
  render();
});
render();
</script>
</body>
</html>
