<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Açaí Fever – Promo-Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=block">
<link rel="stylesheet" href="promo.css">
</head>
<body>
<!-- The TikTok promo films (1080×1920). Without query: preview with sound, space = play/pause,
     arrow keys = one frame. ?version=hype|mix|gameplay the cut (mix and gameplay need footage from
     capture.mjs), ?lang=en English, ?t=12.5 start time, ?render (used by render.mjs). -->
<div id="frame"></div>
<div id="controls">
  <button id="play" type="button">Play</button>
  <span id="time">0.00 s</span>
  <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
  <a id="lang" style="color:#fff"></a>
</div>
<script type="module" src="promo.js"></script>
</body>
</html>
